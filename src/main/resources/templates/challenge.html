<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チャレンジ - COSTLY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen px-4 py-6 sm:px-6">
<div class="max-w-2xl mx-auto w-full">

    <h1 class="text-3xl font-bold text-gray-800 mb-8">COSTLY チャレンジ</h1>

    <!-- 達成状況カード -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">チャレンジ達成状況</h2>

        <!-- 達成済み -->
        <div th:if="${achieved}" class="flex items-center gap-3 p-4 bg-green-50 rounded-lg text-green-700 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-14 h-14 flex-shrink-0">
                <circle cx="100" cy="100" r="95" fill="#fed7aa"/>
                <path d="M62 175 Q62 130 78 118 L122 118 Q138 130 138 175Z" fill="#dc2626"/>
                <ellipse cx="100" cy="112" rx="34" ry="32" fill="#f4b183"/>
                <path d="M64 95 Q66 55 100 50 Q134 55 136 95 L128 95 Q126 68 100 64 Q74 68 72 95Z" fill="#b91c1c"/>
                <path d="M62 92 Q60 80 66 68 Q64 84 70 94Z" fill="#dc2626"/>
                <path d="M138 92 Q140 80 134 68 Q136 84 130 94Z" fill="#dc2626"/>
                <ellipse cx="60" cy="88" rx="10" ry="7" fill="#dc2626" transform="rotate(-20 60 88)"/>
                <path d="M76 108 Q84 100 92 108" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
                <path d="M108 108 Q116 100 124 108" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
                <circle cx="84" cy="118" r="4.5" fill="#1c1917"/>
                <circle cx="116" cy="118" r="4.5" fill="#1c1917"/>
                <path d="M84 136 Q100 150 116 136" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
                <path d="M56 175 Q40 150 46 128 Q54 118 66 122 Q54 140 62 165Z" fill="#f4b183"/>
                <path d="M40 132 L52 108 Q60 102 66 108 L58 132Z" fill="#f4b183"/>
                <circle cx="52" cy="108" r="16" fill="#f4b183"/>
                <path d="M144 175 Q160 150 154 128 Q146 118 134 122 Q146 140 138 165Z" fill="#f4b183"/>
            </svg>
            <span class="text-lg font-bold">よっしゃぁぁ!! その調子だ、来週も攻めていくぞ!!</span>
        </div>
        <!-- 未達成 -->
        <div th:unless="${achieved}" class="flex items-center gap-3 p-4 bg-red-50 rounded-lg text-red-700 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-14 h-14 flex-shrink-0">
                <circle cx="100" cy="100" r="95" fill="#fed7aa"/>
                <path d="M40 80 L34 60 M50 72 L48 50 M150 72 L152 50 M160 80 L166 60" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <path d="M62 175 Q62 130 78 118 L122 118 Q138 130 138 175Z" fill="#dc2626"/>
                <ellipse cx="100" cy="112" rx="34" ry="32" fill="#f4b183"/>
                <path d="M64 95 Q66 55 100 50 Q134 55 136 95 L128 95 Q126 68 100 64 Q74 68 72 95Z" fill="#b91c1c"/>
                <path d="M62 92 Q60 80 66 68 Q64 84 70 94Z" fill="#dc2626"/>
                <path d="M138 92 Q140 80 134 68 Q136 84 130 94Z" fill="#dc2626"/>
                <ellipse cx="60" cy="88" rx="10" ry="7" fill="#dc2626" transform="rotate(-20 60 88)"/>
                <path d="M74 102 L94 108" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
                <path d="M126 102 L106 108" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
                <path d="M80 118 L88 114 L96 118" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M104 118 L112 114 L120 118" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M82 134 Q100 128 118 134 Q118 154 100 158 Q82 154 82 134Z" fill="#7f1d1d"/>
                <path d="M86 138 L114 138" stroke="#fff" stroke-width="3"/>
                <path d="M56 175 Q40 150 46 128 Q54 118 66 122 Q54 140 62 165Z" fill="#f4b183"/>
                <path d="M40 132 L52 108 Q60 102 66 108 L58 132Z" fill="#f4b183"/>
                <circle cx="52" cy="108" r="16" fill="#f4b183"/>
                <path d="M144 175 Q160 150 154 128 Q146 118 134 122 Q146 140 138 165Z" fill="#f4b183"/>
            </svg>
            <span class="text-lg font-bold">くそーっ、悔しいな!!でも下向くな、来週で取り返せ!</span>
        </div>

        <!-- 防衛力 % 表示 -->
        <div class="flex items-baseline gap-3 mb-4">
            <span class="text-5xl font-bold"
                  th:class="${achieved} ? 'text-5xl font-bold text-green-500' : 'text-5xl font-bold text-red-500'"
                  th:text="${#numbers.formatDecimal(defenseRate, 1, 1)} + '%'">32.5%</span>
            <span class="text-gray-400">
                / 目標
                <span th:text="${#numbers.formatDecimal(targetRate, 1, 1)} + '%'">70.0%</span>
            </span>
        </div>

        <!-- プログレスバー -->
        <div class="relative w-full bg-gray-200 rounded-full h-5 mb-1">
            <div class="h-5 rounded-full"
                 th:class="${achieved} ? 'bg-green-400 h-5 rounded-full' : 'bg-red-400 h-5 rounded-full'"
                 th:style="|width: ${defenseRate > 100 ? 100 : defenseRate}%;|"></div>
            <!-- 目標ライン -->
            <div class="absolute top-0 bottom-0 w-0.5 bg-gray-700"
                 th:style="|left: ${targetRate}%;|"></div>
        </div>
        <div class="flex justify-between text-xs text-gray-400 mb-4">
            <span>0%</span>
            <span th:text="'目標 ' + ${#numbers.formatDecimal(targetRate, 1, 1)} + '%'">目標 70.0%</span>
            <span>100%</span>
        </div>

        <!-- 週次メダル表示 -->
        <div class="flex items-center justify-center gap-2 pt-4 border-t border-gray-100">
            <span class="text-2xl">🏅</span>
            <span class="text-gray-600 font-semibold">
                獲得メダル：<span class="text-yellow-600 text-xl font-bold" th:text="${totalMedals}">0</span> 個
            </span>
        </div>

        <!-- 進化キャラクター表示 -->
        <div class="flex justify-center mt-4">
            <!-- ひよこ -->
            <svg th:if="${evolutionStage == 1}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" class="w-24 h-24">
                <ellipse cx="120" cy="175" rx="50" ry="42" fill="#fde047"/>
                <circle cx="120" cy="115" r="32" fill="#fde047"/>
                <circle cx="108" cy="105" r="4" fill="#1c1917"/>
                <circle cx="128" cy="105" r="4" fill="#1c1917"/>
                <path d="M118 116 L100 122 L118 128 Z" fill="#f97316"/>
                <path d="M85 165 Q70 160 68 175" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
                <path d="M155 165 Q170 160 172 175" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
                <path d="M100 215 L108 225 M140 215 L132 225" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <!-- にわとり -->
            <svg th:if="${evolutionStage == 2}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" class="w-24 h-24">
                <ellipse cx="350" cy="180" rx="60" ry="48" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                <circle cx="350" cy="105" r="34" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                <path d="M325 72 Q332 55 340 72 Q346 58 352 72 Q358 60 366 76" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
                <circle cx="337" cy="95" r="4.5" fill="#1c1917"/>
                <circle cx="361" cy="95" r="4.5" fill="#1c1917"/>
                <path d="M349 108 L322 116 L349 124 Z" fill="#f97316"/>
                <ellipse cx="317" cy="128" rx="7" ry="5" fill="#fca5a5" opacity="0.7"/>
                <path d="M400 165 Q432 148 422 185 Q412 197 396 186Z" fill="#e2e8f0"/>
                <path d="M300 225 L292 240 M310 225 L306 242 M330 228 L330 245" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
            </svg>
            <!-- 金のにわとり -->
            <svg th:if="${evolutionStage == 3}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" class="w-24 h-24">
                <ellipse cx="580" cy="180" rx="60" ry="48" fill="#fde047" stroke="#eab308" stroke-width="2"/>
                <circle cx="580" cy="105" r="34" fill="#fde047" stroke="#eab308" stroke-width="2"/>
                <path d="M555 70 Q562 50 570 70 Q576 55 582 70 Q588 57 596 74" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
                <circle cx="567" cy="95" r="4.5" fill="#1c1917"/>
                <circle cx="591" cy="95" r="4.5" fill="#1c1917"/>
                <path d="M579 108 L552 116 L579 124 Z" fill="#f97316"/>
                <ellipse cx="547" cy="128" rx="7" ry="5" fill="#fca5a5" opacity="0.7"/>
                <path d="M630 165 Q664 146 653 187 Q641 200 623 187Z" fill="#fbbf24"/>
                <path d="M530 225 L522 240 M540 225 L536 242 M560 228 L560 245" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
                <path d="M545 50 l4 12 12 2 -9 8 3 12 -10 -7 -10 7 3 -12 -9 -8 12 -2Z" fill="#facc15" stroke="#eab308" stroke-width="1"/>
                <path d="M615 58 l3 9 9 1.5 -6.5 6 2 9 -7.5 -5 -7.5 5 2 -9 -6.5 -6 9 -1.5Z" fill="#facc15" stroke="#eab308" stroke-width="1"/>
            </svg>
        </div>
    </div>

    <!-- ナビゲーション -->
    <div class="flex flex-col items-center mt-6 space-y-3">
        <a href="/dashboard"
           class="inline-block bg-gray-600 hover:bg-gray-700 active:scale-95 text-white font-bold py-3 px-8 rounded-full shadow transition">
            ← ダッシュボードに戻る
        </a>
        <a th:href="@{/expense/new}"
           class="inline-block bg-green-600 hover:bg-green-700 active:scale-95 text-white font-bold py-3 px-8 rounded-full shadow transition">
            ＋ 支出を登録する
        </a>
    </div>

</div>
</body>
</html>
