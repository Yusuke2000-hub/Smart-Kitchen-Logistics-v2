<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>COSTLY - 今日も、家計を守る。</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">

    <!-- ロゴ & キャッチコピー -->
    <div class="text-center mb-8">
        <h1 class="text-6xl font-bold text-gray-800 tracking-widest">COSTLY</h1>
        <p class="text-gray-500 text-lg mt-3">今日も、家計を守る。</p>
    </div>

    <!-- ステータスカード -->
    <div class="bg-white rounded-xl shadow p-6 w-full max-w-sm mb-8">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">現在のステータス</h2>

        <div class="flex items-center justify-between mb-4">
            <div class="text-center">
                <p class="text-xs text-gray-400 mb-1">レベル</p>
                <p class="text-3xl font-bold text-gray-800">Lv.<span th:text="${level}">1</span></p>
            </div>
            <div class="w-px h-12 bg-gray-100"></div>
            <div class="text-center">
                <p class="text-xs text-gray-400 mb-1">生活防衛力</p>
                <p class="text-3xl font-bold"
                   th:class="${defenseRate > 70} ? 'text-3xl font-bold text-red-500' : 'text-3xl font-bold text-green-500'"
                   th:text="${#numbers.formatDecimal(defenseRate, 1, 1)} + '%'">--.--%</p>
            </div>
        </div>

        <div th:if="${defenseRate <= 70}" class="flex items-center gap-2 p-3 bg-green-50 rounded-lg text-green-700 text-sm">
            <span>&#10003;</span>
            <span>目標達成中！このまま継続しよう</span>
        </div>
        <div th:if="${defenseRate > 70}" class="flex items-center gap-2 p-3 bg-red-50 rounded-lg text-red-700 text-sm">
            <span>&#9888;</span>
            <span>目標超過中。ダッシュボードで確認しよう</span>
        </div>
    </div>

    <!-- ミッション開始ボタン -->
    <a href="/dashboard"
       class="bg-green-500 text-white rounded-xl px-10 py-4 text-lg font-bold hover:bg-green-600 transition-colors">
        ミッション開始
    </a>

</body>
</html>
